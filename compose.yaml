services:
  postgres:
    image: postgres:18.1
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-financial_api_defense_lab}
      POSTGRES_USER: ${POSTGRES_USER:-financial_api_lab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  grafana:
    image: grafana/grafana:13.3.1
    profiles: [monitoring]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-financial_api_defense_lab}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_UNIFIED_ALERTING_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    entrypoint:
      - /bin/sh
      - -euc
      - |
        : "$${GRAFANA_DB_PASSWORD:?Set GRAFANA_DB_PASSWORD}"
        : "$${GF_SECURITY_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}"
        [ "$${#GRAFANA_DB_PASSWORD}" -ge 24 ]
        [ "$${#GF_SECURITY_ADMIN_PASSWORD}" -ge 24 ]
        exec /run.sh
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/dashboards:/etc/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

volumes:
  postgres-data:
  grafana-data:
