spring:
  application:
    name: financial-api-defense-lab

server:
  address: 127.0.0.1

security:
  jwt:
    issuer: ${JWT_ISSUER:}
    audience: ${JWT_AUDIENCE:}
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION:}

audit:
  resource-hmac-key: ${AUDIT_RESOURCE_HMAC_KEY:}

mybatis:
  mapper-locations: classpath*:mappers/**/*.xml
  type-handlers-package: lab.financialapi.common.persistence
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true
    local-cache-scope: STATEMENT
