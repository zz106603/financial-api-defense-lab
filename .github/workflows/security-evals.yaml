name: Security Evals

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evals:
    name: Isolated security mutation evaluations
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Verify prerequisites
        run: |
          docker info > /dev/null
          test -x ./gradlew
          python3 --version

      - name: Test evaluation verdicts and isolation
        run: python3 -m unittest discover -s scripts/tests -p test_security_evals.py

      - name: Evaluate clean control and four injected defects
        run: python3 scripts/security_evals.py

      - name: Upload evaluation evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-evals
          path: build/security-evals/
          if-no-files-found: warn
          retention-days: 7
